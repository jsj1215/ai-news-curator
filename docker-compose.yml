services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ainews}
      - DB_USERNAME=${DB_USERNAME:-ainews}
      - DB_PASSWORD=${DB_PASSWORD:-ainews}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      # 호스트 외부에 DB를 노출하지 않도록 localhost에만 바인딩
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-ainews}
      - POSTGRES_USER=${DB_USERNAME:-ainews}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ainews}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ainews}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
